name: balanzify-production

services:
  app:
    build: .
    volumes:
      - .:/app
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    image: balanzify:balanzify
    container_name: balanzify_backend
    command: python3 manage.py runserver 0.0.0.0:8000
    env_file:
      - .env

  db:
    image: postgres:bullseye
    container_name: balanzify_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: balanzify
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: