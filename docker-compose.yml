name: balanzify-backend

# Bounded container-log rotation. The default json-file driver grows without
# limit; cap each container to 50MB x 3 files so logs can never fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - .:/app
      - /var/log/balanzify:/var/log/balanzify
      # AWS credentials for S3 Read Only, local development only
      # - ~/.aws:/root/.aws:ro
    ports:
      - 5000:5000
    depends_on:
      - redis
    environment:
      - AWS_STORAGE_BUCKET_NAME=balanzify-s3-511590151275-us-east-2-an
      - AWS_S3_REGION_NAME=us-east-2
      - AWS_EC2_METADATA_DISABLED=false
      # Bound the ASGI sync thread pool so the app cannot open an unbounded
      # number of DB connections under load (RDS max_connections is only 79).
      - ASGI_THREADS=8
    # image: balanzify:balanzify
    container_name: balanzify_backend
    # Gunicorn manages uvicorn ASGI workers (keeps chatio websockets working)
    # and RECYCLES each worker after ~max-requests, which reclaims any DB
    # connections / memory it accumulated -- this is what breaks the ~24h
    # connection-exhaustion cycle. Worker count x ASGI_THREADS bounds total DB
    # connections (3 x 8 = 24, well under RDS max_connections).
    # Old single-process server (no recycling): daphne -b 0.0.0.0 -p 5000 master.asgi:application
    command: >
      gunicorn master.asgi:application
      -k uvicorn_worker.UvicornWorker
      -b 0.0.0.0:5000
      --workers 3
      --max-requests 800
      --max-requests-jitter 200
      --timeout 120
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    env_file: .env

  celery:
    build: .
    restart: unless-stopped
    logging: *default-logging
    container_name: balanzify_celery
    # --max-tasks-per-child recycles each worker process after N tasks so it
    # cannot accumulate leaked memory or DB connections over time.
    command: celery -A master worker --loglevel=info --max-tasks-per-child=200
    volumes:
      - .:/app
      # The whole directory, not just celery/. Django's `app_out` and
      # `app_error` handlers write to /var/log/balanzify/out.log and
      # error.log, and the loggers that matter for background work --
      # recurringio and journalio -- route there rather than to the celery
      # handlers. With only the celery/ subdirectory mounted, those lines
      # went to a path inside the container and vanished on restart.
      #
      # That is why the nightly recurring job's balance check produced
      # nothing visible: it was running and logging into the void.
      - /var/log/balanzify:/var/log/balanzify
    depends_on:
      - redis
    env_file: .env

  # The scheduler. Separate from the worker so a beat crash cannot take task
  # execution down with it, and so its logs are readable on their own. Beat only
  # ENQUEUES work -- the celery worker above still runs it.
  celery_beat:
    build: .
    restart: unless-stopped
    logging: *default-logging
    container_name: balanzify_celery_beat
    # --schedule writes the last-run state to a file so a restart does not
    # re-fire what already ran today.
    command: celery -A master beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - .:/app
      # The whole directory, not just celery/. Django's `app_out` and
      # `app_error` handlers write to /var/log/balanzify/out.log and
      # error.log, and the loggers that matter for background work --
      # recurringio and journalio -- route there rather than to the celery
      # handlers. With only the celery/ subdirectory mounted, those lines
      # went to a path inside the container and vanished on restart.
      #
      # That is why the nightly recurring job's balance check produced
      # nothing visible: it was running and logging into the void.
      - /var/log/balanzify:/var/log/balanzify
    depends_on:
      - redis
    env_file: .env

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    container_name: balanzify_redis
    ports:
      - "6380:6379"
  
