# Pilucent -- local development stack. Self-contained: Postgres, Redis, the
# app, a Celery worker and beat. Production is docker-compose.prod.yml.
#
#   docker compose up --build        # first run: builds, migrates, starts
#   docker compose run --rm app python manage.py seed_bd_rule_book
#   docker compose run --rm app python manage.py createsuperuser
#
# Database settings come from .env (DB_NAME, DB_USER, DB_PASSWORD, DB_PORT),
# which compose reads for the ${...} below. The same .env, with
# DB_HOST=localhost, lets `manage.py` run on the host against this database:
# Postgres is published on DB_PORT. Without a .env the defaults apply.
#
# Ports on the host: API 8000, Postgres ${DB_PORT} (5432), Redis 6381.

name: pilucent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# Settings every Django container shares. The database HOST and port are pinned
# to the `db` service here -- `environment` overrides .env, so .env can never
# point the containers at a remote database -- while its name, role and
# password follow .env.
x-django-env: &django-env
  DEBUG: "True"
  # Plain HTTP locally: no HTTPS redirect, no secure-only cookies.
  HTTPS_ONLY: "False"
  SECRET_KEY: ${SECRET_KEY:-django-insecure-pilucent-local-dev-only}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-pilucent_dev}
  DB_SSLMODE: disable
  # Runtime role: restricted, so Row-Level Security is enforced locally too.
  DB_USER: ${DB_USER:-pilucent_app}
  DB_PASSWORD: ${DB_PASSWORD:-pilucent_app_dev}
  CELERY_BROKER_URL: redis://redis:6379/0
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  LOG_DIR: /app/logs
  APP_URL: ${APP_URL:-http://localhost:3000}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
  # No AWS_STORAGE_BUCKET_NAME: files are stored locally under media/.

x-django: &django
  build: .
  image: pilucent-backend:dev
  logging: *default-logging
  # Optional: put third-party keys (email, Moov, ...) in .env.
  env_file:
    - path: .env
      required: false
  environment: *django-env
  volumes:
    - .:/app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-pilucent_dev}
      # Owner: runs migrations, owns the tables. Not used by the app.
      POSTGRES_USER: pilucent
      POSTGRES_PASSWORD: ${PILUCENT_DB_PASSWORD:-pilucent_dev}
      # The app's restricted role, created by docker/postgres/init.
      PILUCENT_APP_DB_USER: ${DB_USER:-pilucent_app}
      PILUCENT_APP_DB_PASSWORD: ${DB_PASSWORD:-pilucent_app_dev}
    volumes:
      - pilucent_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilucent -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PILUCENT_REDIS_PORT:-6381}:6379"

  # One-off: applies migrations as the OWNER role (the app role has DML only
  # and cannot run DDL), then exits. Everything else waits for it.
  migrate:
    <<: *django
    environment:
      <<: *django-env
      DB_USER: pilucent
      DB_PASSWORD: ${PILUCENT_DB_PASSWORD:-pilucent_dev}
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *django
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${PILUCENT_APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  celery:
    <<: *django
    restart: unless-stopped
    command: celery -A master worker --loglevel=info --max-tasks-per-child=200
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  celery_beat:
    <<: *django
    restart: unless-stopped
    command: celery -A master beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  pilucent_pgdata:
