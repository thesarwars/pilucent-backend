<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to {{company.name}}</title>
    <link
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-pzjw8f+ua7Kw1TIq0v8FqFjcJ6pajs/rfdfs3SO+kD4Ck5BdPtF+to8xMp9MvcJ"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .container {
        padding-top: 50px;
        padding-bottom: 50px;
        margin: auto;
        max-width: 800px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <table
        class="main"
        style="
          font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
          box-sizing: border-box;
          font-size: 14px;
          border-radius: 3px;
          background-color: #fff;
          margin: 0;
          border: 1px solid #e9e9e9;
          width: 100%;
        "
      >
        <tbody>
          <tr
            style="
              font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
              box-sizing: border-box;
              font-size: 14px;
              margin: 0;
            "
          >
            <td
              class=""
              style="
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                box-sizing: border-box;
                font-size: 16px;
                vertical-align: top;
                color: #fff;
                font-weight: 500;
                text-align: center;
                border-radius: 3px 3px 0 0;
                background-color: #38414a;
                margin: 0;
                padding: 20px;
              "
            >
              <span style="font-size: 32px; color: #fff; text-decoration: none">
                {{company.name}}</span
              >
              <br />
            </td>
          </tr>
          <tr
            style="
              font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
              box-sizing: border-box;
              font-size: 14px;
              margin: 0;
            "
          >
            <td
              class="content-wrap"
              style="
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                box-sizing: border-box;
                font-size: 14px;
                vertical-align: top;
                margin: 0;
                padding: 20px;
              "
              valign="top"
            >
              <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                style="
                  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                  box-sizing: border-box;
                  font-size: 14px;
                  margin: 0;
                "
              >
                <tbody>
                  <tr
                    style="
                      font-family: 'Helvetica Neue', Helvetica, Arial,
                        sans-serif;
                      box-sizing: border-box;
                      font-size: 14px;
                      margin: 0;
                    "
                  >
                    <td
                      class="content-block"
                      style="
                        font-family: 'Helvetica Neue', Helvetica, Arial,
                          sans-serif;
                        box-sizing: border-box;
                        font-size: 14px;
                        vertical-align: top;
                        margin: 0;
                        padding: 0 0 20px;
                      "
                      valign="top"
                    >
                      <h1
                        class="display-4 text-center"
                        style="margin: 0; text-align: center"
                      >
                        Hello, {{user_name}}. Welcome to the {{company.name}}
                      </h1>
                    </td>
                  </tr>
                  <tr
                    style="
                      font-family: 'Helvetica Neue', Helvetica, Arial,
                        sans-serif;
                      box-sizing: border-box;
                      font-size: 14px;
                      margin: 0;
                    "
                  >
                    <td
                      class="content-block"
                      style="
                        font-family: 'Helvetica Neue', Helvetica, Arial,
                          sans-serif;
                        box-sizing: border-box;
                        font-size: 14px;
                        vertical-align: top;
                        margin: 0;
                        padding: 0 0 20px;
                        text-align: center;
                      "
                      valign="top"
                    >
                      We're excited to have you on board. To get started, please
                      click the button below to accept our invitation.
                    </td>
                  </tr>
                  <tr
                    style="
                      font-family: 'Helvetica Neue', Helvetica, Arial,
                        sans-serif;
                      box-sizing: border-box;
                      font-size: 14px;
                      margin: 0;
                    "
                  >
                    <td
                      class="content-block"
                      style="
                        font-family: 'Helvetica Neue', Helvetica, Arial,
                          sans-serif;
                        box-sizing: border-box;
                        font-size: 14px;
                        vertical-align: top;
                        margin: 0;
                        padding: 0 0 20px;
                        text-align: center;
                      "
                      valign="top"
                    >
                      <a
                        href="{{ invitation_link }}"
                        style="
                          font-family: 'Helvetica Neue', Helvetica, Arial,
                            sans-serif;
                          box-sizing: border-box;
                          font-size: 14px;
                          color: #fff;
                          text-decoration: none;
                          line-height: 2em;
                          font-weight: bold;
                          text-align: center;
                          cursor: pointer;
                          display: inline-block;
                          border-radius: 5px;
                          text-transform: capitalize;
                          background-color: #7f3cf0;
                          margin: 0;
                          border-color: #7f3cf0;
                          border-style: solid;
                          border-width: 10px 20px;
                        "
                        >Join Now</a
                      >
                    </td>
                  </tr>
                  <tr
                    style="
                      font-family: 'Helvetica Neue', Helvetica, Arial,
                        sans-serif;
                      box-sizing: border-box;
                      font-size: 14px;
                      margin: 0;
                    "
                  >
                    <td
                      class="content-block"
                      style="
                        font-family: 'Helvetica Neue', Helvetica, Arial,
                          sans-serif;
                        box-sizing: border-box;
                        font-size: 14px;
                        vertical-align: top;
                        margin: 0;
                        padding: 0 0 20px;
                        text-align: center;
                      "
                      valign="top"
                    >
                      Best regards,<br />
                      {{company.name}}<br />
                      {{company.email}}<br />
                      {{company.phone}}
                    </td>
                  </tr>
                  <tr
                    style="
                      font-family: 'Helvetica Neue', Helvetica, Arial,
                        sans-serif;
                      box-sizing: border-box;
                      font-size: 14px;
                      margin: 0;
                    "
                  >
                    <td
                      class="content-block"
                      style="
                        font-family: 'Helvetica Neue', Helvetica, Arial,
                          sans-serif;
                        box-sizing: border-box;
                        font-size: 14px;
                        vertical-align: top;
                        margin: 0;
                        padding: 0 0 20px;
                        text-align: center;
                      "
                      valign="top"
                    >
                      <div
                        style="font-size: 13px; color: #888; margin-top: 20px"
                      >
                        Thank you for using Balanzify.
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
