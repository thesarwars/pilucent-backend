<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balanzify Email Header</title>
    <style>
      /* Reset styles for email compatibility */
      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
      }
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
        font-size: inherit !important;
        font-family: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
      }

      /* Main container styling */
      .container {
        width: 100%;
        max-width: 600px; /* Max width for the email content */
        margin: 0 auto;
        background-color: #ffffff; /* White background for the content area */
        font-family: "Inter", Arial, sans-serif; /* Using Inter, fallback to Arial */
        color: #333333;
      }

      /* Header section styling */
      .header-section {
        background-color:rgb(237, 214, 248); /* Dark background color from your logo image */
        padding: 20px;
        text-align: center; /* Center content within the cell */
        border-radius: 8px 8px 0 0; /* Rounded corners for the top */
      }

      /* Styling for the new inner table for content alignment */
      .header-content-table {
        display: inline-block; /* Allows table to be centered by parent text-align */
      }

      .header-logo-cell {
        padding-right: 15px; /* Adds space between logo and text */
        vertical-align: middle;
      }

      .header-title-cell {
        vertical-align: middle;
      }

      .header-logo {
        border-radius: 8px;
      }

      .header-title {
        color: #ffffff;
        font-size: 30px;
        font-weight: bold;
        margin: 0;
        padding: 0;
        line-height: 1.2;
        white-space: nowrap;
      }

      /* General image styling */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Button styling for email clients */
      .button {
        display: inline-block;
        padding: 12px 24px;
        font-size: 24px;
        font-weight: 600;
        color: #ffffff !important;
        background-color: #6221f7 !important;
        border-radius: 8px;
        text-decoration: none;
        text-align: center;
        mso-padding-alt: 12px 24px; /* Specific padding for Outlook */
        -webkit-text-size-adjust: none; /* Prevent text size adjustment on mobile Safari */
      }
      .button-cell {
        padding-top: 30px;
        text-align: center;
        padding-bottom: 10px;
      }

      /* Responsive styles */
      @media only screen and (max-width: 620px) {
        .container {
          width: 100% !important;
          max-width: 100% !important;
        }
        .header-content-table {
          width: 100% !important; /* Make inner table full width on small screens */
          display: block !important; /* Ensure it behaves as a block */
        }
        .header-logo-cell,
        .header-title-cell {
          display: block !important; /* Stack cells vertically */
          width: 100% !important;
          text-align: center !important; /* Center content when stacked */
          padding: 0 !important; /* Remove cell padding */
        }
        .header-logo-cell {
          padding-bottom: 10px !important; /* Add space below logo when stacked */
        }
        .header-title {
          font-size: 24px !important;
        }
        .button {
          padding: 10px 20px !important; /* Adjust padding for smaller screens */
          font-size: 20px !important;
        }
        .button-cell {
          padding-top: 40px !important; /* Adjust top padding for smaller screens */
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f4">
    <!-- Outer table for background and centering -->
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      role="presentation"
      style="
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      "
    >
      <tr>
        <td align="center" style="padding: 20px 0">
          <!-- Inner container table for email content -->
          <table
            class="container"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            role="presentation"
            style="
              border-collapse: collapse;
              mso-table-lspace: 0pt;
              mso-table-rspace: 0pt;
            "
          >
            <!-- Header Section -->
            <tr>
              <td class="header-section" align="center">
                <!-- New inner table for header content alignment -->
                <table
                  class="header-content-table"
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  role="presentation"
                  style="
                    border-collapse: collapse;
                    mso-table-lspace: 0pt;
                    mso-table-rspace: 0pt;
                  "
                >
                  <tr>
                    <!-- Logo Cell -->
                    <td class="header-logo-cell">
                      <img
                        src="https://balanzify-seven.vercel.app/images/logo_blue.png"
                        alt="Balanzify Logo"
                        class="header-logo"
                        style="height: 60px; width: 250px; border-radius: 8px"
                      />
                    </td>
                    <!-- Company Name Cell
                    <td class="header-title-cell">
                      <h1 class="header-title">Balanzify</h1>
                    </td> -->
                  </tr>
                </table>
              </td>
            </tr>
            <!-- End Header Section -->

            <!-- Placeholder for main content -->
            <tr>
              <td
                style="
                  padding: 30px;
                  background-color: #ffffff;
                  text-align: left;
                "
              >
                <p
                  style="margin: 0 0 15px 0; font-size: 16px; line-height: 1.5"
                >
                  Dear User,
                </p>
                <p
                  style="margin: 0 0 15px 0; font-size: 16px; line-height: 1.5"
                >
                  We received a request to reset your password. Click on the button or open the link
                  to reset it: </br><a href="{{ url }}" style="color: #BA3D4F; text-decoration: underline;">{{ url }}</a>
                </p>
                <p style="margin: 0; font-size: 16px; line-height: 1.5">
                  If you did not request this change, you can ignore this email.
                </p>
              </td>
            </tr>
            <!-- End Placeholder for main content -->

            <!-- Button Section -->
            <tr>
              <td class="button-cell" align="center">
                <!-- You should use an <a> tag for buttons in email for reliability -->
                <a href="{{ url }}" class="button" role="button">
                  Reset Password
                </a>
              </td>
            </tr>
            <!-- End Button Section -->

            <!-- Footer Section (Optional) -->
            <tr>
              <td
                style="
                  background-color: #eeeeee;
                  padding: 20px;
                  text-align: center;
                  font-size: 12px;
                  color: #777777;
                  border-radius: 0 0 8px 8px;
                "
              >
                &copy; 2025 Balanzify. All rights reserved.
              </td>
            </tr>
            <!-- End Footer Section -->
          </table>
          <!-- End Inner container table -->
        </td>
      </tr>
    </table>
    <!-- End Outer table -->
  </body>
</html>
