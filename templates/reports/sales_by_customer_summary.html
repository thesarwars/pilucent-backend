{% load custom_filter %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{{ report.title }}</title>
    <style>
        @page {
            size: A4 portrait; margin: 16mm 14mm 18mm 14mm;
            @bottom-center {
                content: "{{ report.basis }}  {{ printed_at }}";
                font-family: Helvetica, Arial, sans-serif; font-size: 8pt; color: #444;
            }
            @bottom-right {
                content: counter(page) "/" counter(pages);
                font-family: Helvetica, Arial, sans-serif; font-size: 7.5pt; color: #888;
            }
        }
        body { font-family: Helvetica, Arial, sans-serif; font-size: 9pt; color: #1a1a1a; margin: 0; }
        h1 { text-align: center; font-size: 14pt; font-weight: normal; margin: 0 0 4px 0; }
        .subtitle { text-align: center; font-size: 9pt; margin-bottom: 2px; }
        table { width: 100%; border-collapse: collapse; margin-top: 26px; }
        th { border-bottom: 1px solid #999; padding: 4px 6px; font-weight: normal; }
        td { padding: 4px 6px; border-bottom: 1px solid #e2e2e2; }
        .amount { text-align: right; white-space: nowrap; }
        /* A parent with sub-customers is shaded, matching the reference. */
        tr.has-children > td { background-color: #f2f2f2; }
        tr.total > td { font-weight: bold; border-bottom: 1px solid #999; }
        tr.grand > td { font-weight: bold; border-top: 1px solid #999; }
        /* Sub-customers nest arbitrarily deep; indent a few levels. */
        .depth-1 { padding-left: 22px; }
        .depth-2 { padding-left: 44px; }
        .depth-3 { padding-left: 66px; }
        .depth-4 { padding-left: 88px; }
    </style>
</head>
<body>
    <h1>{{ report.company_name }}</h1>
    <div class="subtitle">{{ report.title }}</div>
    <div class="subtitle">{{ report.subtitle }}</div>

    <table>
        <thead>
            <tr><th></th><th class="amount">Total</th></tr>
        </thead>
        <tbody>
            {% for row in report.rows %}
                <tr class="{% if row.key == 'total' %}grand{% elif row.is_total %}total{% endif %}">
                    <td class="depth-{{ row.depth }}">{{ row.label }}</td>
                    <td class="amount">{{ row.total|report_money }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
